services:
  routy:
    image: ghcr.io/emil007/routy:latest
    # Building locally instead of pulling the published image:
    # comment out the "image:" line above and uncomment this one.
    # build: .
    container_name: routy
    restart: unless-stopped
    # Hardening: the container can't write anywhere except the bind-mounted
    # data volume and two small in-memory scratch dirs, root loses every
    # Linux capability except the four the entrypoint's initial chown+gosu
    # step needs, and it can never gain new privileges (e.g. via a setuid
    # binary) even as the "nextjs" user it drops to.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M
        reservations:
          memory: 128M
    ports:
      - "3000:3000"
    volumes:
      # All persistent state (the SQLite database) lives here, on the host —
      # outside the container and outside this project checkout — so it
      # survives image updates, `git pull`, or Docker itself being wiped.
      # Change the left side to wherever you keep appdata/config for your
      # other containers (e.g. /volume1/docker/routy on Synology).
      - ./data:/app/data
    healthcheck:
      # Uses Node's built-in fetch instead of curl/wget — neither is installed
      # in the slim runtime image, and pulling one in just for this isn't worth it.
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      # Docker's default json-file driver never rotates on its own — logs
      # grow unbounded on the host otherwise. 10MB x 5 files, gzipped once
      # rotated.
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
        compress: "true"
    environment:
      # Your reverse proxy already terminates HTTPS in front of this container,
      # so cookies can safely be marked Secure. Set this to "false" if you
      # access Routy directly over plain HTTP (e.g. only inside your LAN).
      - COOKIE_SECURE=true

      # Optional CAPTCHA on the login screen, on top of the always-on
      # rate-limiting. Off by default. To enable, uncomment CAPTCHA_PROVIDER
      # (one of "turnstile", "hcaptcha", "recaptcha") and fill in the site/
      # secret key pair from whichever provider you signed up with:
      #   - Cloudflare Turnstile (free, privacy-friendly): https://dash.cloudflare.com/?to=/:account/turnstile
      #   - hCaptcha (free): https://dashboard.hcaptcha.com/signup
      #   - Google reCAPTCHA v2 (free): https://www.google.com/recaptcha/admin/create
      # - CAPTCHA_PROVIDER=turnstile
      # - CAPTCHA_SITE_KEY=your-site-key
      # - CAPTCHA_SECRET_KEY=your-secret-key

  # Optional: automatic HTTPS for a public domain, via Caddy. Disabled by
  # default — uncomment this whole "caddy:" block (and the "volumes:" section
  # at the bottom of this file) and fill in DOMAIN below, then
  # `docker compose up -d` as usual. Your domain needs an A/AAAA record
  # pointing at this server's public IP, and ports 80+443 must be reachable
  # from the internet (Let's Encrypt verifies ownership over port 80).
  # Nothing else to configure — no separate file to edit.
  # caddy:
  #   image: caddy:2-alpine
  #   container_name: routy-caddy
  #   restart: unless-stopped
  #   depends_on:
  #     - routy
  #   environment:
  #     - DOMAIN=your-domain.example.com
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./Caddyfile:/etc/caddy/Caddyfile:ro
  #     - caddy_data:/data
  #     - caddy_config:/config
  #   logging:
  #     driver: json-file
  #     options:
  #       max-size: "10m"
  #       max-file: "5"
  #       compress: "true"

# volumes:
